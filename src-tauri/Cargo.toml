[package]
name = "ovulate"
version = "1.0.0"
description = "Tracking and Predicting Menstrual Cycle and Fertility/Ovulation window."
authors = ["Carlo Dandan"]
license = "MIT"
repository = "https://github.com/carlodandan/ovulate"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Desktop-only: updater has no mobile implementation
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

